# Dev session for terrain_value_field. Same shape as helhest_stack / ostrich:
#
#   ln -s ~/projects/terrain_value_field/terrain_value_field.tmuxinator.yml \
#     ~/.config/tmuxinator/terrain_value_field.yml
#   tmuxinator start terrain_value_field
#
# `uv sync --extra dev` makes .venv and installs the package editable, so
# `import terrain_value_field` works without PYTHONPATH.

name: terrain_value_field
root: ~/projects/terrain_value_field

windows:
  - editor:
      layout: even-horizontal
      panes:
        - |
          source .venv/bin/activate
          nvim
  - main-console:
      layout: even-horizontal
      panes:
        - |
          source .venv/bin/activate
          clear
  - claude:
      layout: even-horizontal
      panes:
        - |
          source .venv/bin/activate
          claude
