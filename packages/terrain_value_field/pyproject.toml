[project]
name = "terrain-value-field"
version = "0.1.0"
description = "Cost-to-go over a terrain belief, where feasibility is measured in standard deviations of margin."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "warp-lang>=1.13"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "black>=24.0", "ruff>=0.5"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terrain_value_field"]
