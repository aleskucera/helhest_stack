# robotour-nav: the Robotour mission stack on helhest-jr-nuc, driving OUR navigation_node instead of
# crl_commander. Same windows as the NUC's `robotour` session, except:
#   * the follower runs in `gps` mode (route waypoints as they are, no road segmentation), and
#   * ros/tools/commander_bridge.py stands in for crl_commander (the `adam` session): it offers the
#     commander's services and state to the follower and hands navigation_node one goal at a time.
#
# Start the NUC's `tmux-launch` FIRST (Zenoh router, helhest_bringup with the URDF, Fixposition +
# FP_VRTK -> base_link, static TF relay) -- it replaces helhest-base, which would start a second
# router. Do NOT start `adam`: crl_commander and its path follower would drive /cmd_vel too.
# On the jetson run helhest-nav-robotour (not helhest-nav: the URDF already has its transforms).
#
# The NUC has no checkout of this repo, so both files are copied there:
#
#   scp ros/sessions/robotour-nav.tmuxinator.yml helhest-jr-nuc:.tmuxinator/robotour-nav.yml
#   scp ros/tools/commander_bridge.py helhest-jr-nuc:commander_bridge.py
#   ssh helhest-jr-nuc tmuxinator start robotour-nav
#
# A GPX route instead of QR missions: add gps_file:=<file> to the follower's launch line.

name: robotour-nav
root: /home/robot/workspaces/helhest_ws

startup_window: follower
# ~/.rosrc sets rmw_zenoh + the router endpoints and sources helhest_ws.
pre_window: export ROS_DISTRO=kilted; source ~/.rosrc

windows:
  - map:
      panes:
        - |
          sleep 3
          ros2 launch map_data osm_cloud.launch.py mapdata_file:=robotour.mapdata
        - |
          sleep 3
          ros2 run map_data map_data_viewer --config src/map_data/config/helhest_jr.yaml

  - planner:
      panes:
        - |
          sleep 3
          ros2 launch map_data route_planner.launch.py mapdata_file:=robotour.mapdata

  - qr:
      panes:
        - |
          history -s 'ros2 run robot_mission_planner qr_goal_send "geo:50.1103476,14.4159857"'
          history -s 'ros2 service call /qr_goal/enable std_srvs/srv/SetBool "{data: false}"'
          echo "press Up: send a goal by hand / disable the reader"

  - bridge:
      panes:
        # crl_commander's interfaces (its services) come from adam_ws
        - |
          sleep 3
          source /home/robot/workspaces/adam_ws/install/setup.bash
          python3 ~/commander_bridge.py

  - follower:
      panes:
        - |
          sleep 6
          source /home/robot/workspaces/adam_ws/install/setup.bash
          ros2 launch robot_mission_planner gps_follower.launch
        - |
          history -s 'ros2 service call /road_follower/abort std_srvs/srv/Trigger'
          history -s 'ros2 service call /crl_commander/switch_mode crl_commander/srv/SwitchMode "{mode: stop}"'
          echo "press Up: ABORT the current leg / STOP the robot through the bridge"

  - hud:
      panes:
        - |
          sleep 8
          ros2 run robot_mission_planner mission_hud
        - |
          sleep 8
          ros2 run robot_mission_planner fixposition_hud

  - record:
      panes:
        - |
          cd
          history -s "ros2 launch helhest_bringup record_robotour_nuc.launch"
          echo "press Up: record_robotour_nuc.launch (mission bag)"

  - shell:
      panes:
        - cd
