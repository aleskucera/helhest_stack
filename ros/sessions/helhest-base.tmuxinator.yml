# helhest-base: the robot base on helhest-jr-nuc (192.168.18.1), for the helhest-nav stack on the
# jetson. Start it FIRST, then `tmuxinator start helhest-nav` on the jetson.
#
# The NUC has no checkout of this repo, so the file is copied there:
#
#   scp ros/sessions/helhest-base.tmuxinator.yml helhest-jr-nuc:.tmuxinator/helhest-base.yml
#   ssh helhest-jr-nuc tmuxinator start helhest-base
#
# The motor controller (helhest_llc: /cmd_joints and /cmd_vel in, /joint_states, /odom_2d and
# /estop_active out) is ESP32 firmware at 192.168.18.2 that speaks Zenoh and connects to the router
# on THIS machine, port 7447 (checked 2026-09-29: it connects within a second of the port opening).
# Without this router the controller is not on the ROS graph and nothing drives the wheels. The
# jetson's router connects to this one, so everything meets here.
#
# Deliberately left out: GNSS, cameras, sound (helhest_bringup helhest.launch / tmux-launch-kilted),
# and above all the Robotour mission stack -- its follower drives the robot through /cmd_vel and
# must never run together with navigation_node.

name: helhest-base
root: /home/robot/workspaces/helhest_ws
startup_window: view
# ~/.rosrc sets rmw_zenoh, ZENOH_CONFIG_OVERRIDE_ROUTER (this machine's endpoints) and sources helhest_ws.
pre_window: export ROS_DISTRO=kilted; source ~/.rosrc

windows:
  - zenoh:
      panes:
        - ZENOH_CONFIG_OVERRIDE="$ZENOH_CONFIG_OVERRIDE_ROUTER" ros2 run rmw_zenoh_cpp rmw_zenohd
  - view:
      layout: even-horizontal
      panes:
        # Both at their rates (~100 Hz and ~30 Hz) = the controller is connected and alive.
        - |
          sleep 8; ros2 topic hz /joint_states
        - |
          sleep 8; ros2 topic hz /odom_2d
  - shell:
      panes:
        - cd
