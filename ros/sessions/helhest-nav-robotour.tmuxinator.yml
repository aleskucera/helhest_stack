# helhest-nav-robotour: navigation_node on helhest-jr-jetson as the navigation layer of the Robotour
# mission stack (NUC: tmux-launch + robotour-nav, see ros/sessions/robotour-nav.tmuxinator.yml).
#
# Differs from helhest-nav in two ways:
#   * no static transforms of our own: the NUC's helhest_bringup publishes the URDF, which already
#     has base_link -> odin1_base_link (same 0.1, 0, 0.1) and base_link -> imu. Our
#     imu_link -> imu would give `imu` a second parent; the URDF's has the same rotation, so the
#     gyro still resolves.
#   * Robotour's QR reader on the camera, which feeds the route planner on the NUC.
# Goals come from the commander bridge on /goal_pose, already in odom_odin.
#
#   ln -s /home/robot/workspaces/helhest_ws/src/helhest_stack/ros/sessions/helhest-nav-robotour.tmuxinator.yml \
#         ~/.tmuxinator/helhest-nav-robotour.yml
#   tmuxinator start helhest-nav-robotour

name: helhest-nav-robotour
root: /home/robot/workspaces/helhest_ws
startup_window: nav
pre_window: source ~/.rosrc; source /home/robot/workspaces/helhest_ws/install/setup.bash; source /home/robot/workspaces/odin_ws/install/setup.bash

windows:
  - zenoh:
      panes:
        - |
          export ZENOH_CONFIG_OVERRIDE="$ZENOH_CONFIG_OVERRIDE_ROUTER"
          ros2 run rmw_zenoh_cpp rmw_zenohd
  - odin:
      panes:
        - |
          sleep 3
          ros2 launch cras_odin_driver odin1_ros2.launch map_mode:=0
  - qr:
      panes:
        - |
          sleep 3
          ros2 launch robot_mission_planner qr_goal.launch
  - nav:
      panes:
        - |
          sleep 12
          cd src/helhest_stack
          source ros/tools/dev-shell.sh
          export PYTHONPATH="$PWD/ros/helhest_stack_ros:$PYTHONPATH"
          python3 -m helhest_stack_ros.navigation_node --ros-args \
            --params-file ros/config/odin.params.yaml \
            --params-file ros/config/odin_cras.params.yaml
  - view:
      layout: even-horizontal
      panes:
        - |
          sleep 14; ros2 topic echo /crl_commander/state
        - |
          sleep 14; ros2 topic echo /goal_pose --field pose.position
  - shell:
      panes:
        - cd src/helhest_stack
