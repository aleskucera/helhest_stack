# Odin1 elevation_node params. Run the node directly; override ANY param inline with -p
# (inline -p wins over this file):
#
#   ros2 run helhest_stack_ros elevation_node --ros-args \
#     --params-file <repo>/ros/odin/odin_elevation.params.yaml \
#     -p plan_wmax:=5.0 -p k_turn:=0.6 -p plan_turn:=0.08
#
# SAFETY: plan_actuate is TRUE here (operator choice) -> a /goal_pose DRIVES the robot.
# Run viz-only with -p plan_actuate:=false. (Motor limit ~15 rad/s, so plan_wmax /
# plan_max_omega here have plenty of headroom -- raise plan_wmax for more speed.)
/**:
  ros__parameters:
    # --- sources (topics / frames) ---
    lidar_topic: /odin1/cloud_raw       # raw dTOF cloud replaces Ouster
    odom_topic: /odin1/odometry         # Odin SLAM pose replaces /odom_2d + ICP/EKF
    imu_topic: /odin1/imu
    base_frame: odin1_base_link         # cloud already in this frame -> sensor TF = identity
    map_frame: map

    # --- Odin pipeline: no ICP, no EKF, no deskew, no gyro prior ---
    icp_enable: false                   # trust the Odin pose directly (dead-reckoning)
    deskew_enable: false                # Odin per-point time is seconds; deskew assumes ns
    imu_rotation_prior: false           # gyro prior + identity IMU TF rolls the map ~40 deg
    publish_map_tf: true                # elevation owns map -> odom_odin ...
    publish_odom_tf: true               # ... and odom_odin -> odin1_base_link

    # --- robot self-filter box (measured for the Odin mount) ---
    self_filter_enable: true
    self_x_min: -0.05
    self_x_max: 0.55
    self_y_min: -0.75
    self_y_max: 0.75
    footprint_robot_height: 0.45        # odin1_base_link sits ~0.45 m above the floor (measured from floor plane)

    # --- ACTUATION: ARMED by default (operator choice) -- a /goal_pose DRIVES the robot.
    #     Run viz-only with -p plan_actuate:=false. Plan is device-centered (offset from the
    #     real base_link) until a mount TF exists; drive with a clear space + e-stop. ---
    plan_actuate: true

    # --- tuning knobs (override inline with -p) ---
    plan_wmax: 6.0            # top per-wheel speed [rad/s] -- motor limit ~15, so headroom to raise this
    plan_max_omega: 7.5       # hard output clamp on |wheel vel| [rad/s] -- keep >= plan_wmax
    # Turn gain. alpha = 1 + k_turn*mu sets how much the skid-steer resists yaw, and alpha
    # DIVIDES the predicted yaw rate -- too high and the planner expects less yaw than it gets, so
    # the robot overshoots turns. MEASURED 2026-08-10 on flat tarmac: alpha = 1.50 from three
    # independent estimates (steady arcs 1.52, spins 1.50-1.70, lag fit 1.55), which is k = 0.62.
    # 0.6 gives 1.48 and is the indoor preset. The previous 1.0 here was the OUTDOOR preset,
    # calibrated on grass/dirt where the wheels grip harder: it predicts alpha 1.80 and over-
    # estimates turn resistance by 20% on tarmac. Raise it back toward 1.0 for grass or dirt.
    # Wheel envelope half-width [m]. 0.10 = the measured tread as a yaw-binned CYLINDER (the
    # default): honest laterally, where the sphere reached 0.35 m sideways and refused gaps the
    # robot can straddle. 0.0 = back to the sphere. This is also the lateral SAFETY MARGIN dial --
    # 0.15 keeps 5 cm per side, 0.20 keeps 10 cm, both far tighter than the sphere's fixed 0.35.
    # Costs ~3.9 ms per perception frame to dilate (64 yaw slices) against 0.06 for the sphere.
    # --- robustness tube: the OTHER kind of margin ---------------------------------------------
    # These erode the cost-to-go's feasible set, so a pose only routes as feasible if it stays
    # feasible under +/- this much POSITION and HEADING error. That is margin against localisation
    # and tracking error, and it is independent of plan_wheel_width, which is margin against the
    # robot's own SHAPE. Prefer widening these over fattening the wheel: the tube keeps the routing
    # conservative while the envelope stays geometrically honest.
    #
    # BOTH QUANTISE, so small values silently do nothing and intermediate ones are unreachable.
    # The lateral erosion is a whole number of ROUTING CELLS, and the routing cell is
    # `resolution` x `plan_lat_coarsen` = 0.08 x 3 = 0.24 m. So the tube can be 0.24 or 0.48 --
    # 0.20 was asked for and is NOT reachable; it rounds to one cell, 0.24 m. Likewise a heading
    # bin is 360/plan_n_theta = 15 deg, so under 7.5 deg rounds to ZERO and 15.0 buys one bin.
    #
    # plan_lat_coarsen was 4 (cell 0.32 m, tube 0.32 m). Going to 3 buys a finer routing grid AND
    # a smaller tube, and costs solve time: measured on the deployed 16 m window, 3.8 -> 10.1 ms,
    # which is 15% of a 66 ms sensor frame since the cost-to-go re-solves every plan cycle.
    # Coarsen 2 (cell 0.16, tube 0.16 m) would be the way to get nearer 20 cm but costs 25.0 ms,
    # 38% of the frame -- not worth 8 cm.
    plan_robust_margin_m: 0.20
    plan_lat_coarsen: 3
    plan_robust_margin_deg: 15.0
    plan_wheel_width: 0.10
    k_turn: 0.6
    # Wheel-differential penalty. THE knob for how willing the planner is to turn, and 0.8 was
    # far too high: measured closed-loop on flat open ground (scripts/turn_eval.py), a goal at 90
    # or 180 deg was NEVER REACHED in 70 s, because a differential of 2 rad/s costs 0.8*25*4 = 80
    # against a progress pull of only 0.3*V^2 -- 10.8 at 6 m to go. Turning lost by 7x, so the
    # robot drove almost straight and orbited.
    #
    #   plan_turn   goal at 90 deg      goal at 180 deg
    #   0.8         never (70 s)        never (70 s)
    #   0.4         17.9 s              28.0 s
    #   0.2         13.7 s              15.5 s      <- here
    #   0.1         11.0 s              13.7 s
    #
    # Lower is quicker but restores the micro-turn wobble on straights this was raised to damp;
    # 0.2 is the compromise. plan_max_slew turned out NOT to matter (17.9 s at both 2 and 6).
    plan_turn: 0.2
    # Wheel-speed CHANGE penalty -- the anti-jerk knob, and the right one for wobble. plan_turn
    # above penalises the SIZE of a turn, which cannot tell a deliberate 90 deg repositioning from
    # a wobble; this penalises CHANGING YOUR MIND, which is what wobble is. It expands to
    # 2*d(mean)^2 + d(diff)^2/2, so it damps both channels. Raised from the 2e-3 default:
    #
    #   plan_smooth   straight: flips/s  jerk   max lat   90 deg   180 deg
    #   2e-3          0.60               0.042  0.09 m    13.7 s   15.5 s
    #   4e-2          0.36               0.033  0.05 m    13.7 s   15.8 s   <- here
    #   1e-1          0.12               0.043  0.09 m    16.4 s   17.8 s   over-damped
    #
    # For comparison the old plan_turn 0.8 gave 0.32 / 0.027 / 0.03 m on straights -- so this
    # recovers nearly all of that smoothness while turning still works. Past 1e-1 it inverts:
    # corrections get deferred and come out larger, so jerk rises again AND turning degrades.
    plan_smooth: 0.04
    # Accel cap on the published command [rad/s^2]. Raised 2.0 -> 6.0 (the node default). The
    # justification is the drivetrain's own lag: tau = 0.19 s means a 1 rad/s step is already
    # answered at only ~5.3 rad/s^2 by the motors, so a 2.0 clamp was TIGHTER THAN THE HARDWARE
    # and was shaping a command the wheels could not have followed anyway.
    #
    # Measured cost, plan_turn 0.2 / plan_smooth 0.04: straight-line 8.4 -> 7.7 s and 180 deg
    # 15.8 -> 15.5 s, against COMMAND jerk 0.033 -> 0.058. Note that is jerk in the command; the
    # 0.19 s actuator lag low-passes it before it reaches the wheels, so the robot should not feel
    # 76% jerkier. If it does, come back here rather than to plan_smooth -- raising plan_smooth to
    # compensate was measured and BACKFIRES (0.06 doubles the turn-direction flips to 0.89/s and
    # costs 2 s on a 90 deg turn).
    plan_max_slew: 6.0
    plan_max_decel: 8.0       # decel cap d(cmd)/dt [rad/s^2] -> softer slow-down (also the stop ramp)
    plan_goal_running: 0.3    # progress pull -> higher = faster toward goal
    plan_effort: 0.001        # wheel-speed^2 penalty -> lower = faster

    # --- TURN BRAKE: slow into a corner, then accelerate out (both knobs 0 = off) ---
    # Live-tunable, no node restart:
    #   ros2 param set /elevation plan_turn_brake_a_max 0.8
    #   ros2 param set /elevation plan_turn_brake_lookahead_s 1.0
    # a_max caps lateral acceleration [m/s^2]; forward speed and turn differential are scaled
    # TOGETHER so the planned arc is unchanged, only slower. At plan_wmax 6 / k_turn 1 the
    # hardest arc the planner can command is ~1.5 m/s^2, so start around 0.6-1.2.
    plan_turn_brake_a_max: 1.1
    # Pre-apply the tightest cap found this far ahead along the committed plan, so the robot is
    # already slow when it enters the corner. 0 = react to the current command only.
    plan_turn_brake_lookahead_s: 1.5
